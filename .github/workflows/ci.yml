name: CI

# Every push to main and every pull request: formatting, lints and the core tests on Linux
# (cheap minutes). Pull requests also get a macOS `cargo check`, clippy of the app crate and
# the core tests.
# The full UI suite and the macOS release build run on demand (Actions > CI > Run workflow)
# because macOS minutes cost 10x on a private repo.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: "Also run the full UI test suite and a macOS build check"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # Pinned to the toolchain the project is developed and linted with; newer clippy
      # releases add lints, which would fail -D warnings without a code change.
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: System libraries for the UI crate
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libgtk-3-dev libxdo-dev mesa-vulkan-drivers libvulkan1
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Core and MCP tests
        run: cargo test -p cleancraft-core -p cleancraft-mcp
      - name: Full workspace tests (on demand)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full }}
        run: cargo test --workspace --no-fail-fast

  # Every pull request: the macOS-only code (menu bar status item, panel, notifications) is
  # compiled and linted on a Mac, so API mistakes surface on the PR, and the core tests run
  # on APFS.
  macos-check:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p cleancraft --all-targets
      - run: cargo clippy -p cleancraft --all-targets -- -D warnings
      # APFS and macOS tools differ from Linux (case-insensitive names, no non-UTF-8 names,
      # allocated sizes): the core runs its tests on a Mac too.
      - name: Core and MCP tests on macOS
        run: cargo test -p cleancraft-core -p cleancraft-mcp --no-fail-fast

  macos-build:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full }}
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p cleancraft --all-targets -- -D warnings
      - run: cargo build --release -p cleancraft
