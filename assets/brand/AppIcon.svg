<?xml version="1.0" encoding="UTF-8"?>
<!-- CleanCraft app icon, Graphite Lime. 1024 canvas, 824 tile with a 100 margin (Apple's
     macOS icon grid). Rendered to assets/AppIcon.png by scripts/render-icon.sh.
     See docs/design/BRAND.md. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <path id="tile" d="M375.2 100.0 H648.8 C728.1 100.0 767.7 100.0 810.3 113.5 C856.9 130.4 893.6 167.1 910.5 213.7 C924.0 256.3 924.0 295.9 924.0 375.2 V648.8 C924.0 728.1 924.0 767.7 910.5 810.3 C893.6 856.9 856.9 893.6 810.3 910.5 C767.7 924.0 728.1 924.0 648.8 924.0 H375.2 C295.9 924.0 256.3 924.0 213.7 910.5 C167.1 893.6 130.4 856.9 113.5 810.3 C100.0 767.7 100.0 728.1 100.0 648.8 V375.2 C100.0 295.9 100.0 256.3 113.5 213.7 C130.4 167.1 167.1 130.4 213.7 113.5 C256.3 100.0 295.9 100.0 375.2 100.0Z"/>
    <!-- The mark: two nested "C" arcs (a CC monogram) and a small sky dot, 100 unit grid. -->
    <path id="arcOuter" d="M74 24 A36 36 0 1 0 74 76"/>
    <path id="arcInner" d="M64 36 A19 19 0 1 0 64 64"/>
    <clipPath id="tileClip"><use href="#tile"/></clipPath>

    <!-- Tile: graphite #26292D at the top to #141618 at the bottom, at 160 degrees. -->
    <linearGradient id="tileFill" gradientUnits="userSpaceOnUse" x1="371" y1="125" x2="653" y2="899">
      <stop offset="0" stop-color="#2E3135"/>
      <stop offset="0.12" stop-color="#26292D"/>
      <stop offset="1" stop-color="#141618"/>
    </linearGradient>
    <!-- Soft light from above, inside the tile. -->
    <radialGradient id="tileGlow" gradientUnits="userSpaceOnUse" cx="512" cy="150" r="560">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <!-- Deeper shade towards the bottom edge. -->
    <linearGradient id="tileDeep" gradientUnits="userSpaceOnUse" x1="0" y1="600" x2="0" y2="924">
      <stop offset="0" stop-color="#05060A" stop-opacity="0"/>
      <stop offset="1" stop-color="#05060A" stop-opacity="0.30"/>
    </linearGradient>
    <!-- Top inner highlight: a hairline that fades out down the sides. -->
    <linearGradient id="rim" gradientUnits="userSpaceOnUse" x1="0" y1="100" x2="0" y2="420">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="0.25" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="outerFill" gradientUnits="userSpaceOnUse" x1="38" y1="24" x2="98" y2="76">
      <stop offset="0" stop-color="#D6FF5C"/>
      <stop offset="1" stop-color="#C6F432"/>
    </linearGradient>

    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="soft4" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <filter id="soft1" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.9"/>
    </filter>
  </defs>

  <!-- Shadow of the tile in the margin, like a macOS app icon. -->
  <use href="#tile" fill="#000000" fill-opacity="0.34" transform="translate(0 10)" filter="url(#tileShadow)"/>

  <!-- Tile. -->
  <use href="#tile" fill="url(#tileFill)"/>
  <g clip-path="url(#tileClip)">
    <rect x="100" y="100" width="824" height="824" fill="url(#tileGlow)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#tileDeep)"/>
  </g>
  <use href="#tile" fill="none" stroke="url(#rim)" stroke-width="5" clip-path="url(#tileClip)"/>

  <!-- The mark, 100 unit grid, centred on the tile. -->
  <g transform="translate(296.22 283.66) scale(4.5667)">
    <!-- Soft cast shadow under the mark. -->
    <use href="#arcOuter" fill="none" stroke="#000000" stroke-opacity="0.30" stroke-width="13" stroke-linecap="round" transform="translate(0 2.4)" filter="url(#soft4)"/>
    <use href="#arcInner" fill="none" stroke="#000000" stroke-opacity="0.22" stroke-width="13" stroke-linecap="round" transform="translate(0 2.0)" filter="url(#soft4)"/>

    <!-- Outer arc: lime. -->
    <use href="#arcOuter" fill="none" stroke="url(#outerFill)" stroke-width="13" stroke-linecap="round"/>
    <!-- A faint top-edge highlight along the outer arc. -->
    <use href="#arcOuter" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2" stroke-linecap="round" transform="translate(0 -1.1)" filter="url(#soft1)"/>

    <!-- Inner arc: white. -->
    <use href="#arcInner" fill="none" stroke="#F1F3F4" stroke-width="13" stroke-linecap="round"/>
    <use href="#arcInner" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="2" stroke-linecap="round" transform="translate(0 -1.0)" filter="url(#soft1)"/>

    <!-- Sky dot, with a small lift and specular. -->
    <circle cx="80" cy="50.8" r="7" fill="#000000" fill-opacity="0.22" filter="url(#soft1)"/>
    <circle cx="80" cy="50" r="7" fill="#5AC8FA"/>
    <circle cx="78.4" cy="48.2" r="2" fill="#FFFFFF" fill-opacity="0.65" filter="url(#soft1)"/>
  </g>
</svg>
