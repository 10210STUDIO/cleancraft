[package]
name = "cleancraft"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
default-run = "cleancraft"
description = "CleanCraft desktop app, CLI and MCP server"

[lints]
workspace = true

[dependencies]
cleancraft-core = { workspace = true }
cleancraft-mcp = { workspace = true }
cleancraft-ui-egui = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11"] }
serde_json = { workspace = true }
tokio = { workspace = true }
rmcp = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
craft-quit = { workspace = true, features = ["menu"] }
# The menu bar agent (`cleancraft agent`): a status item with a menu, on winit's event loop
# (the same winit eframe uses). muda comes with tray-icon (`tray_icon::menu`).
tray-icon = { version = "0.26.1", default-features = false }
winit = { version = "0.30.13", default-features = false }
# Notifications posted as CleanCraft (not Script Editor), reporting a click, so a click opens
# the app on the notification's page (U7-2). Safe API; osascript stays the fallback.
mac-notification-sys = "0.6.15"
